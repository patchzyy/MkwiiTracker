<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>mkwii tracker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="title-block">
          <h1>mkwii tracker</h1>
          <p class="tracking-start">Started tracking from: <span id="started-from">--</span></p>
        </div>
        <div class="hero-stats" aria-label="Current player counts">
          <article class="stat-card wiimmfi">
            <span>Wiimmfi</span>
            <strong id="wiimmfi-count">--</strong>
            <small>all time high: <b id="wiimmfi-ath">--</b></small>
          </article>
          <article class="stat-card rwfc">
            <span>RWFC</span>
            <strong id="rwfc-count">--</strong>
            <small>all time high: <b id="rwfc-ath">--</b></small>
          </article>
          <article class="stat-card newwfc">
            <span>newWFC</span>
            <strong id="newwfc-count">--</strong>
            <small>all time high: <b id="newwfc-ath">--</b></small>
          </article>
        </div>
      </section>

      <section class="panel status-panel" aria-labelledby="status-title">
        <div class="panel-head">
          <div>
            <h2 id="status-title">Status tracker</h2>
            <p id="status-caption">Last 90 days of successful updates.</p>
          </div>
        </div>
        <div class="status-list" id="status-list" aria-label="Service status history"></div>
      </section>

      <section class="panel chart-panel">
        <div class="panel-head">
          <div>
            <h2>Concurrent Players</h2>
            <p id="chart-caption">Loading snapshots...</p>
          </div>
          <div class="controls" aria-label="Timeline controls">
            <button class="range-button is-active" data-range="24">24h</button>
            <button class="range-button" data-range="72">3d</button>
            <button class="range-button" data-range="168">7d</button>
            <button class="range-button" data-range="all">All</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="timeline" width="1200" height="520" aria-label="Timeline chart of concurrent players"></canvas>
        </div>
        <div class="legend">
          <span><i class="wiimmfi-key"></i>Wiimmfi</span>
          <span><i class="rwfc-key"></i>RWFC</span>
          <span><i class="newwfc-key"></i>newWFC</span>
        </div>
      </section>
    </main>
    <script src="app.js?v=4"></script>
  </body>
</html>
